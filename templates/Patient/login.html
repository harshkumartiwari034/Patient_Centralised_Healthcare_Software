<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login</title>

    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --bg1: #e0ecff;
            --bg2: #f8fafc;
            --border: #e5e7eb;
            --text: #1e293b;
            --muted: #64748b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg1), var(--bg2));
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            width: 380px;
            max-width: 100%;
            padding: 30px;
            background: #ffffffee;
            backdrop-filter: blur(10px);
            border-radius: 18px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .logo {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #60a5fa);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 28px;
            margin: 0 auto 14px;
        }

        h2 {
            margin: 6px 0;
            color: var(--text);
        }

        .subtitle {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
            display: block;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px #2563eb22;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 60px;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            color: white;
            margin-top: 8px;
        }

        .btn-signup {
            background: var(--success);
            color: white;
        }

        .divider {
            margin: 20px 0;
            font-size: 12px;
            color: var(--muted);
        }

        /* Simple demo credentials box */
        .demo-box {
            margin-top: 20px;
            padding: 15px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            text-align: left;
        }

        .demo-box h3 {
            margin: 0 0 12px;
            color: #1e40af;
            font-size: 16px;
        }

        .demo-box p {
            margin: 8px 0;
            font-size: 13px;
            color: #334155;
            overflow-wrap: anywhere;
        }

        .btn-demo {
            margin-top: 10px;
            background: #2563eb;
            color: white;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #111827;
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 13px;
            max-width: 90%;
        }

        @media (max-width: 420px) {
            .login-container {
                padding: 24px 20px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">+</div>

    <h2>Patient Login</h2>
    <div class="subtitle">
        Secure access to your health records
    </div>

    <form id="loginForm">

        <div class="form-group">
            <label for="email">Email</label>
            <input
                    type="email"
                    id="email"
                    placeholder="example@email.com"
                    required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <div class="password-wrapper">
                <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                >

                <span
                        class="toggle-password"
                        id="toggleText"
                        onclick="togglePassword()"
                >Show</span>
            </div>
        </div>

        <button type="submit" class="btn-login" id="loginButton">
            Login
        </button>

    </form>

    <!-- Funder demo credentials -->
    <div class="demo-box">

        <h3>Demo Login for Funders</h3>

        <p>
            <strong>Email:</strong>
            <span id="demoEmail">demo@example.com</span>
        </p>

        <p>
            <strong>Password:</strong>
            <span id="demoPassword">Demo@123</span>
        </p>

        <button
                type="button"
                class="btn-demo"
                onclick="useDemoCredentials()"
        >
            Use Demo Credentials
        </button>

    </div>

    <div class="divider">OR</div>

    <button
            type="button"
            class="btn-signup"
            onclick="window.location.href='/patient/registration'"
    >
        Create New Account
    </button>

</div>

<script>
    // Replace these with a registered demo patient's credentials.
    const DEMO_EMAIL = "harsh844509@gmail.com";
    const DEMO_PASSWORD = "Harsh@7654";

    const API_URL =
        "https://patient-centralised-healthcare-software.onrender.com/patient/login";

    document.getElementById("demoEmail").textContent = DEMO_EMAIL;
    document.getElementById("demoPassword").textContent = DEMO_PASSWORD;

    function togglePassword() {
        const password = document.getElementById("password");
        const toggle = document.getElementById("toggleText");

        if (password.type === "password") {
            password.type = "text";
            toggle.textContent = "Hide";
        } else {
            password.type = "password";
            toggle.textContent = "Show";
        }
    }

    function showToast(message) {
        const oldToast = document.querySelector(".toast");
        if (oldToast) oldToast.remove();

        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;

        document.body.appendChild(toast);

        setTimeout(() => toast.remove(), 3000);
    }

    function useDemoCredentials() {
        document.getElementById("email").value = DEMO_EMAIL;
        document.getElementById("password").value = DEMO_PASSWORD;

        showToast("Demo credentials filled. Click Login to continue.");
    }

    async function loginUser(email, password) {
        const loginButton = document.getElementById("loginButton");

        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            });

            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                showToast(
                    data.message ||
                    data.description ||
                    "Login failed. Check your credentials."
                );
                return;
            }

            if (!data.access_token || !data.patient_id) {
                showToast("Login response is missing the patient ID or token.");
                return;
            }

            localStorage.setItem("patientToken", data.access_token);
            localStorage.setItem("patientId", data.patient_id);

            window.location.href =
                "patient_dashboard.html?patient_id=" +
                encodeURIComponent(data.patient_id);

        } catch (error) {
            console.error("Login error:", error);
            showToast("Server connection failed. Please try again.");
        } finally {
            loginButton.disabled = false;
            loginButton.textContent = "Login";
        }
    }

    document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
            showToast("Please enter your email and password.");
            return;
        }

        loginUser(email, password);
    });
</script>

</body>
</html>
