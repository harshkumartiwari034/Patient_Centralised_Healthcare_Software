<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Health Records</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        const token = localStorage.getItem("patientToken");
        const params = new URLSearchParams(window.location.search);
        let patientId = params.get("patient_id") || localStorage.getItem("patientId");

        if (!token || !patientId) {
            window.location.replace("/patient/login");
        }
        localStorage.setItem("patientId", patientId);

        fetch("http://127.0.0.1:5000/check/token", {
            headers: { "Authorization": "Bearer " + token }
        })
        .then(res => { if (!res.ok) forceLogout(); })
        .catch(() => forceLogout());

        window.history.pushState(null,null,location.href);
        window.onpopstate = ()=>window.history.pushState(null,null,location.href);

        function forceLogout(){
            localStorage.clear();
            window.location.replace("/patient/login");
        }
    </script>

    <style>
        :root{
            --primary:#0f766e;
            --bg:#f0fdfa;
        }
        body{
            margin:0;
            font-family:Arial;
            background:var(--bg);
        }
        header{
            background:var(--primary);
            color:#fff;
            padding:16px 20px;
        }
        .header-row{
            display:flex;
            align-items:center;
            gap:12px;
        }
        .back-btn{
            background:rgba(255,255,255,.2);
            color:#fff;
            border:none;
            padding:6px 12px;
            border-radius:8px;
            cursor:pointer;
            font-size:14px;
        }
        .container{
            max-width:1100px;
            margin:20px auto;
        }
        .tabs button{
            padding:10px 18px;
            border:none;
            border-radius:20px;
            margin-right:8px;
            cursor:pointer;
        }
        .active{
            background:var(--primary);
            color:#fff;
        }
        .card{
            background:#fff;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,.06);
            margin-bottom:10px;
        }
        .row,.head{
            display:grid;
            grid-template-columns:140px 1fr 120px 140px;
            padding:14px;
            align-items:center;
        }
        .head{
            font-weight:bold;
            background:#ecfeff;
        }
        .btn{
            background:var(--primary);
            color:#fff;
            border:none;
            padding:6px 14px;
            border-radius:6px;
            cursor:pointer;
        }
        .center{
            text-align:center;
            padding:30px;
            color:#666;
        }

        /* MOBILE */
        @media(max-width:600px){
            .row,.head{
                grid-template-columns:1fr;
                gap:6px;
            }
        }
    </style>

</head>

<body>

<header>
    <div class="header-row">
        <button class="back-btn" onclick="goBack()">⬅ Back</button>
        <div>
            <h2 style="margin:0">My Health Records</h2>
            <small>Patient ID: <b id="pid"></b></small>
        </div>
    </div>
</header>

<div class="container">

    <div class="tabs">
        <button id="medBtn" class="active" onclick="loadMedical()">Medical</button>
        <button id="testBtn" onclick="loadTests()">Reports</button>
    </div>

    <div class="card head">
        <div>Date</div>
        <div>Hospital / Lab</div>
        <div>Type</div>
        <div>Action</div>
    </div>

    <div id="records"></div>

</div>

<script>
    pid.innerText = patientId;
    const box = document.getElementById("records");

    function goBack(){
        location.href = "/patient/dashboard"; // change if needed
    }

    function setTab(med){
        medBtn.classList.toggle("active", med);
        testBtn.classList.toggle("active", !med);
    }
    function showLoading(){
        box.innerHTML = `<div class="center">Loading records...</div>`;
    }
    function showEmpty(){
        box.innerHTML = `<div class="center">No records found</div>`;
    }

    function loadMedical(){
    setTab(true);
    showLoading();
    fetch(`http://127.0.0.1:5000/migrant/patient/medical/reports?patient_id=${patientId}`,{
    headers:{Authorization:"Bearer "+token}
    })
    .then(r=>r.json())
    .then(data=>{
        if(!data.length){ showEmpty(); return; }
        box.innerHTML="";
        data.forEach(r=>{
            box.innerHTML+=`
            <div class="card row">
                <div>${new Date(r.created_at).toLocaleDateString()}</div>
                <div>${r.hospital_name}</div>
                <div>Medical</div>
                <div><button class="btn" onclick='openMedical(${JSON.stringify(r)})'>View Details</button></div>
            </div>`;
        });
    });
    }

    function loadTests(){
    setTab(false);
    showLoading();
    fetch(`http://127.0.0.1:5000/migrant/patient/report/files?patient_id=${patientId}`,{
    headers:{Authorization:"Bearer "+token}
    })
    .then(r=>r.json())
    .then(data=>{
        if(!data.length){ showEmpty(); return; }
        box.innerHTML="";
        data.forEach(r=>{
            box.innerHTML+=`
            <div class="card row">
                <div>${new Date(r.created_at).toLocaleDateString()}</div>
                <div>${r.report_category}</div>
                <div>Report</div>
                <div><button class="btn" onclick='openTest(${JSON.stringify(r)})'>Open Report</button></div>
            </div>`;
        });
    });
    }

    function openMedical(r){
    localStorage.setItem("medicalRecord", JSON.stringify(r));
    location.href="/record_detail";
    }

    function openTest(r){
    localStorage.setItem("testRecord", JSON.stringify(r));
    location.href="/test_report";
    }

    loadMedical();
</script>

</body>
</html>
